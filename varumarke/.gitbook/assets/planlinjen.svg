<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <!-- Dark green background -->
  <rect x="0" y="0" width="400" height="240" fill="#2F5731"/>

  <!-- Outer pitch rect -->
  <rect x="20" y="20" width="360" height="200" stroke="#F2F2F2" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Center line -->
  <line x1="200" y1="20" x2="200" y2="220" stroke="#F2F2F2" stroke-width="2" opacity="0.7"/>

  <!-- Center circle -->
  <circle cx="200" cy="120" r="36" stroke="#F2F2F2" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Center dot -->
  <circle cx="200" cy="120" r="4" fill="#FECB00"/>

  <!-- Left penalty area -->
  <rect x="20" y="70" width="64" height="100" stroke="#F2F2F2" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Left goal area -->
  <rect x="20" y="96" width="28" height="48" stroke="#F2F2F2" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Right penalty area -->
  <rect x="316" y="70" width="64" height="100" stroke="#F2F2F2" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Right goal area -->
  <rect x="352" y="96" width="28" height="48" stroke="#F2F2F2" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
