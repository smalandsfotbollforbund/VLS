<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <!-- Left block (red): x=0 y=0 w=196 h=280 — 2fr, full height -->
  <rect x="0" y="0" width="196" height="280" fill="#A91C1C"/>

  <!-- Top middle (green): x=200 y=0 w=96 h=136 -->
  <rect x="200" y="0" width="96" height="136" fill="#2F5731"/>

  <!-- Top right (yellow): x=300 y=0 w=100 h=136 -->
  <rect x="300" y="0" width="100" height="136" fill="#FECB00"/>

  <!-- Bottom middle (black): x=200 y=140 w=96 h=140 -->
  <rect x="200" y="140" width="96" height="140" fill="#333333"/>

  <!-- Bottom right (retrogrön): x=300 y=140 w=100 h=140 -->
  <rect x="300" y="140" width="100" height="140" fill="#99C1A2"/>
</svg>
