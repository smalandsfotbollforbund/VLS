<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620"><rect width="1600" height="620" fill="#E2DBD0"/><rect x="120" y="90" width="1248.0" height="82" fill="#A91C1C"/><text x="150" y="128" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="start">1. TRÄNAREN</text><text x="150" y="154" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="1.5" fill="#FFFFFF" text-anchor="start">PRIMÄR MOTTAGARE. ONT OM TID, MOBILEN I HANDEN, TRÄNING 18.00.</text><rect x="120" y="186" width="1104.0" height="82" fill="#2F5731"/><text x="150" y="224" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="start">2. FÖRENINGSLEDAREN</text><text x="150" y="250" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="1.5" fill="#FFFFFF" text-anchor="start">DE SOM HÅLLER I NYCKELKNIPPAN. FÖRENINGEN FÖRST.</text><rect x="120" y="282" width="960.0" height="82" fill="#333333"/><text x="150" y="320" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="start">3. SPELAREN</text><text x="150" y="346" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="1.5" fill="#FFFFFF" text-anchor="start">FRÅN FÖRSTA SKORNA TILL SISTA MATCHEN.</text><rect x="120" y="378" width="816.0" height="82" fill="#888884"/><text x="150" y="416" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="start">4. DOMAREN</text><text x="150" y="442" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="1.5" fill="#FFFFFF" text-anchor="start">MATCHENS TREDJE LAG.</text><rect x="120" y="474" width="672.0" height="82" fill="#FFFFFF"/><text x="150" y="512" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#333333" text-anchor="start">5. SUPPORTRAR OCH INTRESSENTER</text><text x="150" y="538" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="1.5" fill="#888884" text-anchor="start">GLÖMS ALDRIG, STYR INTE TONVALET.</text><text x="120" y="600" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="1.5" fill="#A91C1C" text-anchor="start">SKRIV FÖR TRÄNAREN NÄR MOTTAGAREN INTE ÄR GIVEN.</text></svg>